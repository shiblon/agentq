# AgentQ development stack.
#
# Claude credentials (pick one):
#   1. claude login (default): docker compose up, then authenticate once:
#        docker compose exec runner claude
#      Follow the login prompt. Credentials persist in the 'claude-credentials' volume.
#   2. API key:                ANTHROPIC_API_KEY=sk-ant-... docker compose up
#
# Submit a prompt once the stack is running (uses your local binary):
#   agentq submit --prompt "Write a hello-world in Go"
#
# Add more agent workers by duplicating the worker-coder service block.

x-eq-env: &eq-env
  AGENTQ_EQ_ADDR: queue:37706

services:

  # ── EntroQ: durable task queue ──────────────────────────────────────────────
  queue:
    image: ghcr.io/shiblon/entroq-mem:v1.0.1
    command: [serve]
    ports:
      - "37706:37706"
    expose:
      - "9100"
    restart: unless-stopped

  # ── MCP server: JWT-gated tool pool ─────────────────────────────────────────
  mcp:
    build: .
    command:
      - mcp
      - serve
      - --insecure-skip-verification
      - --dev-tools
    environment:
      <<: *eq-env
    volumes:
      - workspace:/workspace
    depends_on:
      - queue
    restart: unless-stopped

  # ── Runner: HTTP microservice that execs claude CLI ──────────────────────────
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    command:
      - runner
      - serve
      - --mcp-addr=http://mcp:8081
      - --args=--print
      - --args=--allowedTools
      - --args=mcp__agentq__*
    volumes:
      - claude-credentials:/root/.claude
      - workspace:/workspace
    environment:
      # Set ANTHROPIC_API_KEY if you use an API key instead of claude login.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - mcp
    restart: unless-stopped

  # ── Supervisor: orchestration brain ─────────────────────────────────────────
  supervisor:
    build: .
    command:
      - supervisor
      - serve
      - --insecure-no-keys
      - --runner-url=http://runner:8082
      - --mcp-addr=http://mcp:8081
      - --default-workdir=/workspace
    environment:
      <<: *eq-env
    volumes:
      - workspace:/workspace
    depends_on:
      - queue
      - runner
      - mcp
    restart: unless-stopped

  # ── AgentQ worker: coder ─────────────────────────────────────────────────────
  worker-coder:
    build: .
    command:
      - worker
      - serve
      - --agent=coder
      - --insecure-no-keys
    environment:
      <<: *eq-env
      AGENTQ_CONFIG: /config/agents.yaml
    volumes:
      - ./config/agents.compose.yaml:/config/agents.yaml:ro
      - workspace:/workspace
    depends_on:
      - queue
      - runner
      - mcp
    restart: unless-stopped

  # ── AgentQ worker: echo ──────────────────────────────────────────────────────
  worker-echo:
    build: .
    command:
      - worker
      - serve
      - --agent=echo
      - --insecure-no-keys
    environment:
      <<: *eq-env
      AGENTQ_CONFIG: /config/agents.yaml
    volumes:
      - ./config/agents.compose.yaml:/config/agents.yaml:ro
      - workspace:/workspace
    depends_on:
      - queue
      - runner
      - mcp
    restart: unless-stopped

  # ── Prometheus: scrapes queue metrics ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - queue
    restart: unless-stopped

  # ── Grafana: queue dashboard ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/entroq-dashboard.json:/var/lib/grafana/dashboards/entroq-dashboard.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  claude-credentials:
  workspace:
