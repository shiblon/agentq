version: "3.9"

# Build context is the parent dir so the local entroq replace directive resolves.
x-build: &build
  build:
    context: ..
    dockerfile: agentq/Dockerfile

x-agent: &agent
  <<: *build
  depends_on:
    - eq
  environment:
    AGENTQ_EQ_ADDR: eq:37706
    AGENTQ_LLM_ADDR: http://ollama:11434

services:
  eq:
    <<: *build
    command: ["serve", "--port=37706", "--http-port=9100"]
    ports:
      - "37706:37706"
      - "9100:9100"
    volumes:
      - eq-journal:/data/agentq/journal

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_MODELS:-/tmp/agentq-ollama-models}:/root/.ollama

  supervisor:
    <<: *agent
    command: ["run", "--agent=supervisor", "--eq-addr=eq:37706"]

  coder:
    <<: *agent
    command: ["run", "--agent=coder", "--eq-addr=eq:37706"]

  reviewer:
    <<: *agent
    command: ["run", "--agent=reviewer", "--eq-addr=eq:37706"]

  researcher:
    <<: *agent
    command: ["run", "--agent=researcher", "--eq-addr=eq:37706"]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml
    depends_on:
      - eq

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ../entroq/deploy/grafana/provisioning:/etc/grafana/provisioning
      - ../entroq/deploy/grafana/entroq-dashboard.json:/var/lib/grafana/dashboards/entroq-dashboard.json
    depends_on:
      - prometheus

  gitea:
    image: gitea/gitea:latest
    environment:
      - USER_UID=1000
      - USER_GID=1000
    ports:
      - "3001:3000"   # Gitea web UI
      - "2222:22"     # Gitea SSH
    volumes:
      - gitea-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentq
      MINIO_ROOT_PASSWORD: agentqsecret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio-data:/data

volumes:
  eq-journal:
  gitea-data:
  minio-data:
